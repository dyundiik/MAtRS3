server {
 listen 80;
 location /api/auth/ { proxy_pass http://auth-service:8000/; }
 location /api/trips/ { proxy_pass http://trip-service:8000/; }
 location /api/packing/ { proxy_pass http://packing-service:8000/; }
 location /api/categories/ { proxy_pass http://categorization-service:8000/; }
 location / { default_type application/json; return 200 '{"service":"TripPack API Gateway","routes":["/api/auth/","/api/trips/","/api/packing/","/api/categories/"]}'; }
}
