global:
  scrape_interval: 15s
scrape_configs:
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:8000']
  - job_name: trip-service
    metrics_path: /metrics
    static_configs:
      - targets: ['trip-service:8000']
  - job_name: packing-service
    metrics_path: /metrics
    static_configs:
      - targets: ['packing-service:8000']
  - job_name: categorization-service
    metrics_path: /metrics
    static_configs:
      - targets: ['categorization-service:8000']
